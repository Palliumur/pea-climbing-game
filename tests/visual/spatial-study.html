<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spatial exploration study</title>
  <script type="importmap">{"imports":{"three":"../../dist/vendor/three/three.module.js"}}</script>
  <style>
    html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#c8dfc2;font:13px monospace}
    aside{position:absolute;bottom:20px;left:20px;display:flex;align-items:center;gap:12px;background:#101810e8;padding:14px}
    button,select,input{font:inherit}input{width:240px}output{min-width:240px}
  </style>
</head>
<body>
  <div id="scene"></div>
  <aside>
    <label>Time <input id="time" aria-label="Growth time" type="range" min="0" max="100" step="0.1" value="28"></label>
    <label>View <select id="view" aria-label="View"><option value="front">Front</option><option value="side">Side</option><option value="oblique">Oblique</option></select></label>
    <button id="play">Play</button><output id="status"></output>
  </aside>
  <script type="module">
    import * as THREE from 'three';
    import {PeaSimulation} from '../../dist/simulation.js';
    import {PeaScene} from '../../dist/scene.js';
    const params=new URLSearchParams(location.search),input=document.querySelector('#time'),view=document.querySelector('#view');
    const play=document.querySelector('#play'),status=document.querySelector('#status');
    const sim=new PeaSimulation(),world=new PeaScene(document.querySelector('#scene'),sim);
    const direction=Number(params.get('direction')??.9),history=[];
    const trace=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:'#c8dfc2',transparent:true,opacity:.28}));
    world.scene.add(trace);world.overview=false;
    input.value=params.get('time')??28;view.value=params.get('view')??'oblique';
    let playing=false,previous=0;
    function step(dt){
      sim.setDirection(direction);sim.step(dt);
      history.push(new THREE.Vector3().copy(sim.stemPoint(sim.head.s)));
      if(history.length>660)history.shift();
    }
    function updateTrace(){trace.geometry.dispose();trace.geometry=new THREE.BufferGeometry().setFromPoints(history);}
    function seek(){
      sim.reset();history.length=0;
      for(let frame=0;frame<Math.round(Number(input.value)*30);frame++)step(1/30);
      world.reset();updateTrace();
    }
    world.frameCamera=()=>{
      const apex=sim.stemPoint(sim.head.s),aim={x:sim.head.x,y:Math.max(1.5,apex.y-.45),z:sim.head.z};
      const offset=view.value==='side'?[5.4,1,.1]:view.value==='oblique'?[2.7,1,4.7]:[.3,1,5.4];
      world.camera.position.set(aim.x+offset[0],aim.y+offset[1],aim.z+offset[2]);
      world.camera.lookAt(aim.x,aim.y,aim.z);world.camera.updateMatrixWorld();
    };
    input.addEventListener('input',()=>{playing=false;play.textContent='Play';seek();});
    play.addEventListener('click',()=>{playing=!playing;play.textContent=playing?'Pause':'Play';});
    seek();
    function frame(now){
      if(playing){step(previous?Math.min((now-previous)/1000,.06):0);input.value=sim.time;updateTrace();}
      previous=now;
      status.value=`${sim.time.toFixed(1)} s · ${sim.phase} · ${sim.connections.length} wrapped`;
      world.render(now/1000);requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
