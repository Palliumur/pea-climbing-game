<!doctype html><html><head><meta charset="utf-8"><title>生长动画检查</title><script type="importmap">{"imports":{"three":"../../dist/vendor/three/three.module.js"}}</script><style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden}aside{position:fixed;bottom:20px;left:20px;color:#dde4d0;font:12px sans-serif;background:#283025bb;padding:12px;border-radius:5px}input{width:260px}output{display:inline-block;min-width:180px}</style></head><body><div id="scene"></div><aside><label>生长时间 <input aria-label="生长时间" type="range" min="0" max="55" step="0.5" value="0"></label><output id="readout"></output></aside><script type="module">
import{PeaSimulation}from'../../dist/simulation.js';import{PeaScene}from'../../dist/scene.js';
const s=new PeaSimulation(),world=new PeaScene(document.querySelector('#scene'),s),input=document.querySelector('input');
function seek(){s.reset();s.setDirection(.87);for(let i=0;i<Math.round(Number(input.value)*60);i++)s.step(1/60);world.reset();world.render(s.time);document.querySelector('output').textContent=`${s.time.toFixed(1)} s · ${s.phase} · ${s.connections.length} 连接`;}
input.addEventListener('input',seek);world.ready.then(seek);let frames=0,last=performance.now();function frame(t){world.render(t/1000);frames++;if(frames===120){console.info('Botanical QA mean frame interval',((t-last)/120).toFixed(1),'ms');}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
