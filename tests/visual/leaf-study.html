<!doctype html><html><head><meta charset="utf-8"><title>叶面与支撑检查</title><script type="importmap">{"imports":{"three":"../../dist/vendor/three/three.module.js"}}</script><style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden}aside{position:fixed;bottom:16px;left:16px;color:#dde4d0;font:12px sans-serif;background:#283025dd;padding:12px;display:flex;gap:10px;align-items:center;border-radius:6px}input{width:55px}button,input,select{font:inherit}output{max-width:340px;line-height:1.6}</style></head><body><div id="scene"></div><aside><label>时间 <input aria-label="生长时间" type="number" min="0" max="150" value="0"></label><select aria-label="路线"><option value="right">持续向右</option><option value="return">先左20秒再向右</option></select><button id="seek">显示并检查</button><button id="detail">叶片近景</button><button id="play">播放并测帧</button><output id="result">加载中</output></aside><script type="module">
import * as THREE from 'three';import{PeaSimulation}from'../../dist/simulation.js?v=habitat-1';import{PeaScene}from'../../dist/scene.js?v=habitat-1';import{pointSegmentDistanceSquared}from'../../dist/foliage.js?v=habitat-1';
import {shellGap} from '../../dist/supports.js';
const sim=new PeaSimulation(),world=new PeaScene(document.querySelector('#scene'),sim),input=document.querySelector('input'),route=document.querySelector('select'),output=document.querySelector('output');
function intersection(a,b,v0,v1,v2){const d=b.clone().sub(a),e1=v1.clone().sub(v0),e2=v2.clone().sub(v0),h=d.clone().cross(e2),det=e1.dot(h);if(Math.abs(det)<1e-10)return false;const inv=1/det,s=a.clone().sub(v0),u=s.dot(h)*inv;if(u<0||u>1)return false;const q=s.clone().cross(e1),v=d.dot(q)*inv;if(v<0||u+v>1)return false;const t=e2.dot(q)*inv;return t>1e-5&&t<.99999;}
function check(){let penetrations=0,triangleCrossings=0,vertices=0;const details=[];for(const view of world.leaves)for(const{leaf}of[...view.blades,...view.stipules]){leaf.updateMatrixWorld(true);const p=leaf.geometry.attributes.position,points=[];for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(leaf.matrixWorld);points.push(v);vertices++;if(sim.supports.some(s=>v.y<s.height&&Math.hypot(v.x-s.x,v.z-s.z)<s.extent&&shellGap(s,v)<-.0001))penetrations++;for(const c of world.capsules.candidates(v))if(pointSegmentDistanceSquared(v,c.a,c.b).distanceSquared<(c.physicalRadius-.001)**2)penetrations++;}const ids=leaf.geometry.index.array;for(let i=0;i<ids.length;i+=3){const a=points[ids[i]],b=points[ids[i+1]],c=points[ids[i+2]],center=a.clone().add(b).add(c).multiplyScalar(1/3),candidates=new Set([...world.capsules.candidates(a),...world.capsules.candidates(b),...world.capsules.candidates(c),...world.capsules.candidates(center)]);for(const capsule of candidates)if(intersection(new THREE.Vector3(capsule.a.x,capsule.a.y,capsule.a.z),new THREE.Vector3(capsule.b.x,capsule.b.y,capsule.b.z),a,b,c)){triangleCrossings++;if(details.length<5)details.push(`${view.organ.id}/${leaf.geometry.userData.profile.seed}: tri ${i/3}, owner ${capsule.owner}, radius ${(capsule.physicalRadius).toFixed(3)}`);}}}
output.textContent=`${sim.time.toFixed(1)} s · 网壳 ${sim.supports.length} 根 · 高度 ${sim.head.y.toFixed(2)} · ${sim.connections.length} 连接 · ${vertices} 顶点 · ${penetrations} 穿入 · ${triangleCrossings} 茎线穿面 ${details.join("; ")}`;}
function seek(){sim.reset();for(let i=0;i<Number(input.value)*60;i++){sim.setDirection(route.value==='return'&&sim.time<20?-.85:.95);sim.step(1/60);}world.reset();world.overview=false;world.frameCamera(true);world.render(0);check();}
document.querySelector('#seek').onclick=seek;document.querySelector('#detail').onclick=()=>{world.camera.position.set(-.6,2,3.7);world.camera.lookAt(-.8,1.8,0);world.renderer.render(world.scene,world.camera);};document.querySelector('#play').onclick=()=>{let last=0,n=0,total=0;const end=performance.now()+5000;function tick(now){const dt=last?(now-last)/1000:0;last=now;if(dt){total+=dt;n++;}sim.step(Math.min(.06,dt));world.render(now/1000);if(now<end)requestAnimationFrame(tick);else{check();output.textContent+=` · ${(1000*total/n).toFixed(1)} ms/frame`;}}requestAnimationFrame(tick);};world.ready.then(seek);
</script></body></html>
