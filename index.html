<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="./dist/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pea climbing study</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="preload" href="./assets/fonts/IBMPlexMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/fonts/IBMPlexMono-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./style.css?v=camera-3">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <main class="experience">
    <div id="scene" role="img" aria-label="A growing pea exploring six supports"></div>
    <section class="camera-dock" aria-label="Camera input">
      <div class="camera-frame">
        <div class="preview">
          <video id="video" autoplay muted playsinline hidden></video>
          <canvas id="poseOverlay" aria-hidden="true" hidden></canvas>
          <img id="bodyIcon" src="./assets/icons/body-framing.png" alt="">
        </div>
        <p id="hint" role="status" aria-live="polite" aria-atomic="true">Keep your shoulders and hips in view.</p>
      </div>
      <button id="cameraToggle" type="button" aria-pressed="false">
        <img src="./assets/icons/camera.png" alt="">
        <span id="buttonText">ENABLE CAMERA</span>
      </button>
    </section>
  </main>
  <script type="module" src="./app.js?v=depth-growth-1"></script>
</body>
</html>
